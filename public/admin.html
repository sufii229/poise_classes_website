<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POISE CLASSES | Admin Dashboard</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="admin"><div id="login" class="loginbox"><img src="/assets/poise-logo.png" alt="POISE logo"><h1>POISE CLASSES Admin</h1><p>Registration records • payment verification • admission status</p><input id="u" placeholder="Username" value="admin" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="loginBtn">Login</button><div id="lm"></div><small>Default demo login: admin / POISE@2026. Change it before publishing.</small></div>
<div id="dash" hidden><div class="adminhead"><div><span>ADMIN DASHBOARD</span><h1>Registration Records</h1></div><div class="headactions"><button class="btn small" id="notifyBtn">Enable Notifications</button><button class="btn small" id="refreshBtn">Refresh</button><button class="ghost small" id="exportBtn">Export CSV</button><button class="ghost small" id="logoutBtn">Logout</button></div></div>
<div class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="newCount">0</b><span>New</span></div><div><b id="pending">0</b><span>Payment Pending</span></div><div><b id="confirmed">0</b><span>Admission Confirmed</span></div></div>
<div class="filters"><input id="search" placeholder="Search name, mobile, application ID, UTR…"><select id="payFilter"><option value="">All payment status</option><option>Pending Verification</option><option>Verified</option><option>Rejected</option></select><select id="admFilter"><option value="">All admission status</option><option>New</option><option>Confirmed</option><option>Rejected</option></select></div>
<div id="table"></div></div></main>
<audio id="ding" preload="auto"><source src="data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTAAAAAA" type="audio/wav"></audio>
<script>
let token='',rows=[],lastCount=0,firstLoad=true;const $=id=>document.getElementById(id);
$('loginBtn').onclick=login;$('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('refreshBtn').onclick=()=>load(true);$('notifyBtn').onclick=enableNotifications;$('exportBtn').onclick=exportCSV;$('logoutBtn').onclick=logout;$('search').oninput=render;$('payFilter').onchange=render;$('admFilter').onchange=render;
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const x=await r.json();if(!r.ok){$('lm').textContent='Login failed';return}token=x.token;$('login').hidden=true;$('dash').hidden=false;await load(false);setInterval(()=>load(false),10000)}
async function load(manual){const r=await fetch('/api/registrations',{headers:{Authorization:'Bearer '+token}});if(!r.ok){return}const x=await r.json();rows=x.registrations||[];if(!firstLoad&&rows.length>lastCount){const newest=rows[0];notifyNew(newest)}lastCount=rows.length;firstLoad=false;render();if(manual)flash('Dashboard refreshed ✓')}
function notifyNew(r){try{if(Notification.permission==='granted')new Notification('New POISE CLASSES Registration',{body:r.name+' • '+r.course+' • '+new Date(r.createdAt).toLocaleString()})}catch{};try{$('ding').play().catch(()=>{})}catch{};document.title='🔔 New Registration — POISE Admin';setTimeout(()=>document.title='POISE CLASSES | Admin Dashboard',4000)}
async function enableNotifications(){if(!('Notification'in window)){alert('Is browser me notifications supported nahi hain.');return}const p=await Notification.requestPermission();$('notifyBtn').textContent=p==='granted'?'Notifications Enabled ✓':'Enable Notifications'}
function render(){const q=$('search').value.toLowerCase(),pf=$('payFilter').value,af=$('admFilter').value;const data=rows.filter(r=>(!q||[r.id,r.name,r.mobile,r.utr,r.course].join(' ').toLowerCase().includes(q))&&(!pf||r.paymentStatus===pf)&&(!af||r.admissionStatus===af));$('total').textContent=rows.length;$('newCount').textContent=rows.filter(r=>r.admissionStatus==='New').length;$('pending').textContent=rows.filter(r=>r.paymentStatus==='Pending Verification').length;$('confirmed').textContent=rows.filter(r=>r.admissionStatus==='Confirmed').length;$('table').innerHTML=data.length?data.map(card).join(''):'<div class="empty">No matching registrations.</div>'}
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function card(r){return `<article class="admincard"><div class="rowtop"><div><span class="rid">${esc(r.id)}</span><h3>${esc(r.name)}</h3></div><span class="time">${new Date(r.createdAt).toLocaleString()}</span></div><div class="details"><span><b>Mobile</b>${esc(r.mobile)}</span><span><b>Class</b>${esc(r.className||'—')}</span><span><b>Course</b>${esc(r.course)}</span><span><b>Fee</b>₹${esc(r.amount)}</span><span><b>UTR</b>${esc(r.utr)}</span></div><div class="statusrow"><label>Payment <select onchange="update('${r.id}','paymentStatus',this.value)"><option ${r.paymentStatus==='Pending Verification'?'selected':''}>Pending Verification</option><option ${r.paymentStatus==='Verified'?'selected':''}>Verified</option><option ${r.paymentStatus==='Rejected'?'selected':''}>Rejected</option></select></label><label>Admission <select onchange="update('${r.id}','admissionStatus',this.value)"><option ${r.admissionStatus==='New'?'selected':''}>New</option><option ${r.admissionStatus==='Confirmed'?'selected':''}>Confirmed</option><option ${r.admissionStatus==='Rejected'?'selected':''}>Rejected</option></select></label>${r.paymentScreenshot?`<a class="ghost" target="_blank" href="${esc(r.paymentScreenshot)}">View Payment Screenshot</a>`:''}</div><label>Admin notes<textarea onchange="update('${r.id}','notes',this.value)" placeholder="Add internal note…">${esc(r.notes||'')}</textarea></label></article>`}
async function update(id,k,v){await fetch('/api/registrations/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({[k]:v})});await load(false)}
async function exportCSV(){const r=await fetch('/api/registrations.csv',{headers:{Authorization:'Bearer '+token}});const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='poise-registrations.csv';a.click();URL.revokeObjectURL(a.href)}
async function logout(){await fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}});location.reload()}
function flash(t){const d=document.createElement('div');d.className='flash';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
</script></body></html>
